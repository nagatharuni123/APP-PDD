      - uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: test-suites/reports/load-test-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  vulnerability-tests:
    name: "🔒 Vulnerability Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Run Vulnerability Tests (450)
        run: cd test-suites && node runners/vulnerability-runner.js
      - name: Generate Vulnerability Excel Report
        run: cd test-suites && node reporters/vulnerability-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: vulnerability-test-report
          path: test-suites/reports/vulnerability-test-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  full-e2e-tests:
    name: "🔄 Full E2E Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Run Full E2E Tests (450)
        run: cd test-suites && node runners/full-e2e-runner.js
      - name: Generate Full E2E Excel Report
        run: cd test-suites && node reporters/full-e2e-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: test-suites/reports/full-e2e-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  compile-master-report:
    name: "📊 Compile Master Excel Report"
    runs-on: ubuntu-latest
    needs:
      - selenium-web-tests
      - appium-android-tests
      - unit-api-tests
      - validation-tests
      - deployment-status-tests
      - load-performance-tests
      - vulnerability-tests
      - full-e2e-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: test-suites/reports/downloaded
      - name: Compile Master Excel Report
        run: cd test-suites && node reporters/master-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: master-report
          path: test-suites/reports/master-report.xlsx
