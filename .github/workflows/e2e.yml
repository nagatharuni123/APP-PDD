        run: cd test-suites && npm install
      - name: Run Unit API Tests (450)
        run: cd test-suites && node runners/unit-api-runner.js
      - name: Generate Unit API Excel Report
        run: cd test-suites && node reporters/unit-api-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-suites/reports/unit-test-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  validation-tests:
    name: "✅ Validation Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Run Validation Tests (450)
        run: cd test-suites && node runners/validation-runner.js
      - name: Generate Validation Excel Report
        run: cd test-suites && node reporters/validation-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: test-suites/reports/validation-test-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  deployment-status-tests:
    name: "🚀 Deployment Status Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Run Deployment Status Tests (450)
        run: cd test-suites && node runners/deployment-runner.js
      - name: Generate Deployment Excel Report
