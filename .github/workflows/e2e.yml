name: e2e

on:
  push:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  selenium-web-tests:
    name: "🌐 Selenium Web Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Run Selenium Web Tests (450)
        run: cd test-suites && node runners/selenium-web-runner.js
      - name: Generate Selenium Web Excel Report
        run: cd test-suites && node reporters/selenium-web-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: test-suites/reports/selenium-web-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  appium-android-tests:
    name: "📱 Appium Android Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: cd test-suites && npm install
      - name: Run Appium Android Tests (450)
        run: cd test-suites && node runners/appium-android-runner.js
      - name: Generate Appium Android Excel Report
        run: cd test-suites && node reporters/appium-android-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: test-suites/reports/appium-android-report.xlsx

  # ──────────────────────────────────────────────────────────────────────────
  unit-api-tests:
